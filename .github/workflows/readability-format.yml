name: Readability Format

on:
  push:
    paths:
      - '.github/workflows/readability-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Format JavaScript, CSS, HTML, and Markdown
        run: |
          npx --yes prettier@3.6.2 --write \
            "src/main/resources/static/**/*.js" \
            "src/main/resources/static/**/*.css" \
            "src/main/resources/static/**/*.html" \
            "README.md"

      - name: Format Java
        run: |
          curl -fsSL -o google-java-format.jar \
            https://github.com/google/google-java-format/releases/download/v1.28.0/google-java-format-1.28.0-all-deps.jar
          find src -type f -name '*.java' -print0 | \
            xargs -0 java -jar google-java-format.jar --replace
          rm google-java-format.jar

      - name: Commit readability cleanup
        run: |
          if git diff --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md
          git commit -m "Format all source files for readability"
          git push

# The formatter only commits application source files, not this workflow.
