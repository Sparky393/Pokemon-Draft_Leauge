<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Draft League Portal</title>
    <link rel="stylesheet" href="/css/style.css?v=idle1" />
    <link rel="stylesheet" href="/css/modern.css?v=30" />
    <link rel="stylesheet" href="/css/final-ui.css?v=30" />
    <link rel="stylesheet" href="/css/season.css?v=2" />
    <link rel="stylesheet" href="/css/team-branding.css?v=1" />
    <link rel="stylesheet" href="/css/league-admin.css?v=2" />
    <link rel="stylesheet" href="/css/form-feedback.css?v=1" />
    <link rel="stylesheet" href="/css/league-extras.css?v=2" />
    <link rel="stylesheet" href="/css/mobile-experience.css?v=2" />
    <link rel="stylesheet" href="/css/draft-experience.css?v=frozen1" />
    <!-- deployment persistence test -->
  </head>
  <body>
    <div id="toast"></div>
    <div id="login-screen" class="center-screen">
      <div class="login-card">
        <div class="eyebrow">League Portal</div>
        <h1>Pokemon Draft League</h1>
        <p class="muted">
          Sign in to manage your season. Automatic sign-out after 5 minutes
          without activity.
        </p>
        <p id="session-idle-message" class="muted hidden" role="status"></p>
        <label>Username<input id="login-username" /></label
        ><label>Password<input id="login-password" type="password" /></label
        ><button id="login-button">Log In</button>
        <button id="guest-button" type="button" class="secondary">
          Continue as Guest
        </button>
      </div>
    </div>
    <p
      id="session-refresh-status"
      class="session-refresh-status"
      role="status"
      hidden
    >
      Updating league data…
    </p>
    <div id="app" class="app hidden">
      <aside class="sidebar" id="league-sidebar">
        <div class="sidebar-topbar">
          <div class="brand">Draft League</div>
          <button
            id="sidebar-toggle"
            class="secondary sidebar-toggle"
            type="button"
            aria-controls="league-sidebar"
            aria-expanded="true"
            aria-label="Collapse navigation"
            title="Collapse navigation"
          >
            ‹
          </button>
        </div>
        <div id="whoami" class="whoami"></div>
        <nav>
          <button data-page="home">Home</button
          ><button data-page="draft">Draft Room</button
          ><button data-page="rosters">Rosters</button
          ><button data-page="standings">Standings</button
          ><button data-page="schedule">Schedule / Results</button
          ><button data-page="playoffs">Playoffs</button
          ><button data-page="transactions">Transactions</button
          ><button data-page="lineup">Weekly Lineup</button
          ><button data-page="freeagency">Free Agency</button
          ><button id="manager-nav" data-page="manager" class="hidden">
            Commissioner
          </button>
        </nav>
        <button data-page="account">Account / Password</button>
        <button id="logout-button" class="logout">Log Out</button>
      </aside>
      <main class="content">
        <button
          id="sidebar-open"
          class="secondary sidebar-open"
          type="button"
          aria-controls="league-sidebar"
          aria-expanded="false"
          hidden
        >
          ☰ Show navigation
        </button>
        <section id="page-home" class="page"></section>
        <section id="page-draft" class="page hidden"></section>
        <section id="page-rosters" class="page hidden"></section>
        <section id="page-standings" class="page hidden"></section>
        <section id="page-schedule" class="page hidden"></section>
        <section id="page-playoffs" class="page hidden"></section>
        <section id="page-lineup" class="page hidden"></section>
        <section id="page-freeagency" class="page hidden"></section>
        <section id="page-manager" class="page hidden"></section>
        <section id="page-transactions" class="page hidden"></section>
        <section id="page-account" class="page hidden"></section>
      </main>
    </div>
    <script src="/js/session-idle.js?v=2"></script>
    <script src="/js/app.js?v=idle1"></script>
    <script src="/js/api-fix.js?v=idle1"></script>
    <script src="/js/modern.js?v=egress2"></script>
    <script src="/js/champions-learnsets.js?v=1"></script>
    <script src="/js/pokemon-ui.js?v=gourgeist1"></script>
    <script src="/js/final-ui.js?v=budget2"></script>
    <script src="/js/testing-ui.js?v=egress2"></script>
    <script src="/js/faab-ui.js?v=32"></script>
    <script src="/js/league-fixes.js?v=30"></script>
    <script src="/js/form-ui-fixes.js?v=idle1"></script>
    <script src="/js/draft-live.js?v=budget1"></script>
    <script src="/js/draft-board-export.js?v=1"></script>
    <script src="/js/account-ui.js?v=idle1"></script>
    <script src="/js/season-ui.js?v=playoff-seeds1"></script>
    <script src="/js/team-branding.js?v=1"></script>
    <script src="/js/league-extras.js?v=idle1"></script>
    <script src="/js/commissioner-reminders.js?v=2"></script>
    <script src="/js/navigation-ui.js?v=1"></script>
  </body>
</html>
